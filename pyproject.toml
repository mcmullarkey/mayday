[project]
name = "mayday"
version = "0.1.0"
description = "Jackbox-style party game about disasters at sea"
readme = "README.md"
authors = [
    { name = "Michael Mullarkey", email = "mullarkey.mike+github@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "segno>=1.6.6",
    "starlette>=1.8.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
mayday = "mayday.cli:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "websockets>=17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 20
